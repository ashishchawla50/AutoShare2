; Supervisord configuration for the trading bot
; Place this at /etc/supervisor/conf.d/trading_bot.conf on the VPS

[program:trading_bot]
command=/home/trader/venv/bin/python /home/trader/trading_bot/main.py
directory=/home/trader/trading_bot
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stdout_logfile=/home/trader/trading_bot/logs/supervisor_stdout.log
stderr_logfile=/home/trader/trading_bot/logs/supervisor_stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONPATH="/home/trader/trading_bot",PYTHONUNBUFFERED="1"
user=trader

[program:auth_flask]
command=/home/trader/venv/bin/python /home/trader/trading_bot/broker/auth_server.py
directory=/home/trader/trading_bot
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/home/trader/trading_bot/logs/auth_server.log
stderr_logfile=/home/trader/trading_bot/logs/auth_server_err.log
environment=PYTHONPATH="/home/trader/trading_bot"
user=trader

[group:trading]
programs=trading_bot,auth_flask
