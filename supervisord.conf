; Supervisord configuration for the trading bot (Oracle Cloud VPS, user ubuntu)
; Installed at /etc/supervisor/conf.d/autoshare.conf
; After editing: sudo supervisorctl -c /etc/supervisor/supervisord.conf reread && ... update

[program:autoshare]
command=/home/ubuntu/AutoShare2/venv/bin/python /home/ubuntu/AutoShare2/main.py
directory=/home/ubuntu/AutoShare2
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stdout_logfile=/home/ubuntu/AutoShare2/logs/supervisor_stdout.log
stderr_logfile=/home/ubuntu/AutoShare2/logs/supervisor_stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONPATH="/home/ubuntu/AutoShare2",PYTHONUNBUFFERED="1"
user=ubuntu

[program:auth_flask]
command=/home/ubuntu/AutoShare2/venv/bin/python /home/ubuntu/AutoShare2/broker/auth_server.py
directory=/home/ubuntu/AutoShare2
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/home/ubuntu/AutoShare2/logs/auth_server.log
stderr_logfile=/home/ubuntu/AutoShare2/logs/auth_server_err.log
environment=PYTHONPATH="/home/ubuntu/AutoShare2",PYTHONUNBUFFERED="1"
user=ubuntu
